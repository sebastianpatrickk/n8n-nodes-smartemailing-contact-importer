name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

# Required for provenance
permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build package
        run: npm run build

      - name: Check if version changed
        id: version-check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view n8n-nodes-smartemailing-contact-importer version 2>/dev/null || echo "0.0.0")
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "npm_version=$NPM_VERSION" >> $GITHUB_OUTPUT
          if [ "$PACKAGE_VERSION" != "$NPM_VERSION" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "📦 Version changed: $NPM_VERSION → $PACKAGE_VERSION"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "⏭️ Version unchanged: $PACKAGE_VERSION"
          fi

      # Publish with provenance using NPM_TOKEN
      - name: Publish to npm with provenance
        if: steps.version-check.outputs.should_publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.version-check.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version-check.outputs.package_version }}
          name: Release v${{ steps.version-check.outputs.package_version }}
          body: |
            ## n8n-nodes-smartemailing-contact-importer v${{ steps.version-check.outputs.package_version }}
            
            📦 [View on npm](https://www.npmjs.com/package/n8n-nodes-smartemailing-contact-importer)
            
            ✅ Published with [npm provenance](https://docs.npmjs.com/generating-provenance-statements) - verified build from this repository!
            
            ### Installation
            ```bash
            npm install n8n-nodes-smartemailing-contact-importer
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip publish (version unchanged)
        if: steps.version-check.outputs.should_publish == 'false'
        run: echo "⏭️ Skipping publish - version ${{ steps.version-check.outputs.package_version }} already exists on npm"
